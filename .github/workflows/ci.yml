name: EduBridge checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/ml/requirements-runtime.lock
      - run: npm ci
      - run: python -m pip install -r server/ml/requirements-research.txt
      - run: npx playwright install --with-deps chrome
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:ml
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
